# n8n（n8n-io/n8n 公式イメージ, Sustainable Use License: 自社内利用OK）
# 起動: .\scripts\n8n.ps1 up → http://localhost:5678
# officeworker API（python -m officeworker serve）には http://host.docker.internal:8765 で到達
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Tokyo
      TZ: Asia/Tokyo
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../n8n/workflows:/workflows:ro
volumes:
  n8n_data:
